server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't advertise the nginx version.
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml;

    # The client bundle is content-hashed, so it is safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /favicon.svg {
        expires 7d;
        add_header Cache-Control "public";
    }

    # index.html must never be cached, or clients keep loading a stale bundle
    # that references assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # `set` forces runtime DNS resolution, so a restarted `api` container (new
    # IP) is picked up without reloading this config.
    location /api/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Admin image uploads can exceed the 1MB nginx default.
        client_max_body_size 8m;
        proxy_read_timeout 60s;
    }

    # Product images uploaded through the admin panel.
    location /uploads/ {
        set $api_upstream http://api:4000;
        proxy_pass $api_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Client-side routing: unknown paths fall back to the SPA shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
